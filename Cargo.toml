[workspace]
resolver = "2"
members = [
    "crates/catalog-reasoner",
    "crates/catalog-ingest",
    "tools/iptv-fixture",
    "apps/desktop/src-tauri",
    "crates/core",
    "crates/m3u",
    "crates/xtream",
    "crates/epg",
    "crates/hls-proxy",
    "crates/transcribe",
    "crates/media",
    "crates/mpv-player",
    "crates/storage",
    "crates/jobs",
    "crates/search",
    "crates/mcp",
    "crates/enrich",
    "crates/artwork",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# HTTP server
axum = { version = "0.8", features = ["tokio"] }

# HTTP client
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }

# XML parsing
quick-xml = { version = "0.37", features = ["serialize"] }

# Bytes (shared HTTP body buffer type)
bytes = "1"

# Testing
insta = { version = "1", features = ["json", "yaml"] }

# On-device embeddings (catalog enrichment)
fastembed = "4"
# Read the existing FastEmbed cache without constructing a network client.
hf-hub = { version = "0.4", default-features = false }

# Local translation (NLLB-200 via CTranslate2 + Metal, bundled tokenizers)

# Utilities
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
imagesize = "0.13"
ring = "0.17"
zeroize = "1"
tempfile = "3"
libc = "0.2"
security-framework = { version = "3.7", features = ["OSX_10_15"] }
core-foundation = "0.10"

# Apple native view interop
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSColor",
    "NSGraphics",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSView",
    "NSWindow",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSError",
    "NSGeometry",
    "NSKeyValueCoding",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "objc2-app-kit",
    "WKWebView",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "CAOpenGLLayer",
    "objc2-core-foundation",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVAsset",
    "AVPlayer",
    "AVPlayerItem",
    "AVRouteDetector",
    "objc2-core-media",
] }
objc2-av-kit = { version = "0.3", default-features = false, features = [
    "std",
    "AVRoutePickerView",
    "objc2-av-foundation",
    "objc2-app-kit",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMTime",
] }

[profile.dev]
incremental = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
