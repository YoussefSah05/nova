[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/core",
    "crates/m3u",
    "crates/xtream",
    "crates/epg",
    "crates/hls-proxy",
    "crates/transcribe",
    "crates/translate",
    "crates/media",
    "crates/mpv-player",
    "crates/storage",
    "crates/jobs",
    "crates/search",
    "crates/mcp",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# HTTP server
axum = { version = "0.8", features = ["tokio"] }

# HTTP client
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }

# XML parsing
quick-xml = { version = "0.37", features = ["serialize"] }

# Bytes (shared HTTP body buffer type)
bytes = "1"

# Testing
insta = { version = "1", features = ["json", "yaml"] }

# Utilities
uuid = { version = "1", features = ["v4"] }

# Apple native view interop
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSColor",
    "NSGraphics",
    "NSOpenGL",
    "NSOpenGLView",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSKeyValueCoding",
    "NSObject",
    "NSString",
    "NSValue",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "objc2-app-kit",
    "WKWebView",
] }

[profile.dev]
incremental = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
