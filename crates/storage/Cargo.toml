[package]
name = "nova-storage"
version = "0.1.0"
edition = "2021"
description = "SQLite storage layer (sqlx, WAL mode): app.db + per-profile DBs, migrations, repositories"

[dependencies]
nova-core = { path = "../core" }
nova-epg = { path = "../epg" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }
core-foundation = { workspace = true }

[dev-dependencies]
ts-rs = { workspace = true }
nova-search = { path = "../search" }
