[package]
name = "nova-catalog-ingest"
version = "0.1.0"
edition = "2021"
publish = false
description = "Unconnected lossless catalog adapters and protected record staging"

[dependencies]
nova-core = { path = "../core" }
nova-storage = { path = "../storage" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = { workspace = true }
uuid = { workspace = true }
