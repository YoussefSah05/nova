[package]
name = "nova-transcribe"
version = "0.1.0"
edition = "2021"
description = "whisper-cli subprocess driver + model management for on-device ASR"

[dependencies]
nova-core = { path = "../core" }
nova-align = { path = "../align" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
zip = { workspace = true }
unicode-normalization = { workspace = true }
libc = { workspace = true }
tempfile = { workspace = true }

# whisper.cpp in the ASR worker process. On macOS the Core ML encoder runs on
# the Neural Engine, with Metal as the fallback and the cold-start path.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { workspace = true, features = ["metal", "coreml"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { workspace = true }
