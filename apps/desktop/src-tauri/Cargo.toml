[package]
name = "nova-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "nova_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nova-core = { path = "../../../crates/core" }
nova-storage = { path = "../../../crates/storage" }
nova-m3u = { path = "../../../crates/m3u" }
nova-xtream = { path = "../../../crates/xtream" }
nova-epg = { path = "../../../crates/epg" }
nova-hls-proxy = { path = "../../../crates/hls-proxy" }
nova-mpv-player = { path = "../../../crates/mpv-player" }
nova-media = { path = "../../../crates/media" }
nova-transcribe = { path = "../../../crates/transcribe" }
nova-jobs = { path = "../../../crates/jobs" }
sqlx = { workspace = true }
uuid = { workspace = true }
dirs = "5"
reqwest = { workspace = true }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }
objc2-quartz-core = { workspace = true }
objc2-web-kit = { workspace = true }
objc2-av-foundation = { workspace = true }
objc2-av-kit = { workspace = true }
objc2-core-media = { workspace = true }
