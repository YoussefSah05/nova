<!doctype html>
<html lang="en" style="background: #0a0a0c; color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Nova</title>
    <style>
      /* Painted before any bundle loads: the Nova mark on the app surface, so
         launch never flashes white or an unstyled page. Removed by main.tsx. */
      #nova-boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(60% 50% at 50% 42%, rgba(224, 163, 62, 0.1), transparent 70%), #0a0a0c;
        transition: opacity 200ms cubic-bezier(0.7, 0, 0.84, 0);
      }
      #nova-boot[data-done] {
        opacity: 0;
        pointer-events: none;
      }
      #nova-boot span {
        display: flex;
        width: 56px;
        height: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: linear-gradient(135deg, #e9b65f, #dd9f37);
        color: #16120a;
        font:
          500 28px/1 system-ui,
          sans-serif;
        box-shadow: 0 12px 40px rgba(224, 163, 62, 0.28);
        animation: nova-boot-in 400ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes nova-boot-in {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #nova-boot,
        #nova-boot span {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="nova-boot" aria-hidden="true"><span>N</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
