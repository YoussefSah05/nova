name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust checks (no Tauri window system deps needed) ──────────────────────
  rust:
    name: Rust — check / clippy / test / fmt
    runs-on: macos-14
    env:
      # sqlx::query! macros read the committed .sqlx/ cache instead of
      # connecting to a live database during the build.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (libmpv for the player crate)
        env:
          # Don't rebuild installed dependents (the runner ships the `iina`
          # cask, which depends on mpv; reinstalling it runs a post-install
          # hook that hits the GitHub API and fails on rate limits).
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          # Authenticate brew's GitHub API calls to avoid HTTP 403 rate limits.
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tauri 2 on macOS uses the system WebKit — no extra packages needed.
          # nova-mpv-player links libmpv; the Homebrew mpv formula ships libmpv
          # plus a pkg-config file (build.rs prefers `pkg-config --libs mpv`).
          brew install mpv

      - name: cargo check
        run: cargo check --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo fmt
        run: cargo fmt --all -- --check

  # ── TypeScript / frontend checks ─────────────────────────────────────────
  frontend:
    name: TypeScript — typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # Version is read from the "packageManager" field in package.json
        # (pnpm@9.15.4). Specifying it here too triggers ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm typecheck

      - name: Stack manifest and tooling regression tests
        run: |
          pnpm verify-environment --manifest-only
          pnpm test:environment

      - name: ESLint
        run: pnpm lint

      - name: Vitest
        run: pnpm test
