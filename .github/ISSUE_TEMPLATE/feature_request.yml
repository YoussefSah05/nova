name: Feature request
description: Suggest an idea for Nova
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: checkboxes
    id: roadmap
    attributes:
      label: Roadmap
      options:
        - label: I checked the [roadmap](https://github.com/YoussefSah05/nova/blob/main/docs/roadmap.md) and existing issues.
          required: true
